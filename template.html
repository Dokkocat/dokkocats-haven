<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dokkos Corner</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Share Tech Mono', monospace;
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            color: #e0e0e0;
            overflow-x: hidden;
        }

        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.5;
        }

        header {
            padding: 80px 20px;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .letter-title {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 5px;
        }

        .letter-title img {
            image-rendering: pixelated;
            width: 40px;
            height: auto;
            filter: drop-shadow(0 0 5px #4aa3a3);
        }

        footer {
            background-color: rgba(26, 26, 26, 0.9);
            padding: 20px;
            text-align: center;
            position: relative;
            bottom: 0;
            width: 100%;
        }

        .section {
            padding: 40px 20px;
            max-width: 800px;
            margin: 30px auto;
            background-color: rgba(26, 26, 26, 0.8);
            border: 2px solid #4aa3a3;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(74, 163, 163, 0.3);
            position: relative;
            z-index: 1;
        }

        .nav {
            display: flex;
            justify-content: center;
            background-color: rgba(26, 26, 26, 0.9);
            padding: 10px 0;
            position: sticky;
            top: 0;
            z-index: 10;
            transition: background-color 0.3s;
        }
        body.light-mode .nav {
            background-color: rgba(240, 240, 240, 0.9);
        }
        .nav a {
            color: #4aa3a3;
            text-decoration: none;
            padding: 10px 20px;
            font-size: 1.2em;
            font-weight: bold;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }

        .nav a:hover {
            color: #8a6d8b;
            text-shadow: 0 0 10px rgba(138, 109, 139, 0.5);
        }
    </style>
</head>
<body>
    <canvas id="backgroundCanvas"></canvas>
    
    <div class="nav">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="projects.html">Projects</a>
        <a href="gallery.html">Gallery</a>
        <a href="anime.html">Anime</a>
    </div>
    <header>
        <div class="letter-title">
            <img src="D.png" alt="D">
            <img src="O.png" alt="O">
            <img src="K.png" alt="K">
            <img src="K.png" alt="K">
            <img src="O.png" alt="O">
            <img src="C.png" alt="C">
            <img src="A.png" alt="A">
            <img src="T.png" alt="T">
        </div>
        <p class="neon-purple">The one and only, Dokkocat</p>
    </header>

    <section class="section">
        <h2 class="neon-purple">Section Title</h2>
        <p>Content goes here.</p>
    </section>

    <footer>
        <p>&copy; 2025 dokkocat. All rights reserved.</p>
    </footer>

    <script>
        const canvas = document.getElementById('backgroundCanvas');
        const ctx = canvas.getContext('2d');
        let particlesArray = [];

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 1 + 0.5;
                this.speedX = Math.random() * 2 - 1;
                this.speedY = Math.random() * 2 - 1;
                this.opacity = Math.random() * 0.5 + 0.5;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x > canvas.width || this.x < 0) this.speedX *= -1;
                if (this.y > canvas.height || this.y < 0) this.speedY *= -1;
                this.opacity = Math.random() * 0.5 + 0.5;
            }

            draw() {
                ctx.fillStyle = `rgba(74, 163, 163, ${this.opacity})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.closePath();
                ctx.fill();
            }
        }

        function init() {
            particlesArray = [];
            for (let i = 0; i < 100; i++) {
                particlesArray.push(new Particle());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].update();
                particlesArray[i].draw();
            }
            requestAnimationFrame(animate);
        }

        function resizeCanvas() {
            const dpr = window.devicePixelRatio || 1;
            canvas.width = window.innerWidth * dpr;
            canvas.height = window.innerHeight * dpr;
            ctx.scale(dpr, dpr);
            init();
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        init();
        animate();
    </script>

    
<script>
    // Function to check if the page exists
    function checkPageExists(url) {
        const xhr = new XMLHttpRequest();
        xhr.open('HEAD', url, false); // Synchronous request
        try {
            xhr.send();
            return xhr.status === 200; // Returns true if the page exists
        } catch (e) {
            return false; // Return false if there was an error
        }
    }

    // Add event listeners to the navigation links
    const links = document.querySelectorAll('.nav a');

    links.forEach(link => {
        link.addEventListener('click', function(e) {
            const href = link.getAttribute('href');
            if (!checkPageExists(href)) {
                // If page does not exist, redirect to the error page
                e.preventDefault();
                window.location.href = 'error.html';
            }
        });
    });
</script>

</body>
</html>
